<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="60%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="mtnGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="mtnGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="hillGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="hillGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#0f5132"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sky Background -->
  <rect width="800" height="450" fill="url(#skyGrad)"/>

  <!-- Morning Sun -->
  <circle cx="520" cy="160" r="75" fill="url(#sunGrad)" opacity="0.9" filter="url(#softGlow)"/>
  <circle cx="520" cy="160" r="105" fill="#fef08a" opacity="0.25"/>

  <!-- Sun Rays -->
  <path d="M520,40 L520,20 M520,280 L520,300 M400,160 L380,160 M640,160 L660,160 M435,75 L420,60 M605,245 L620,260 M435,245 L420,260 M605,75 L620,60" 
        stroke="#f59e0b" stroke-width="3" stroke-linecap="round" opacity="0.4"/>

  <!-- Distant Appalachian Ridge -->
  <path d="M0,230 Q120,160 260,205 T540,195 Q680,165 800,215 L800,450 L0,450 Z" fill="url(#mtnGrad1)" opacity="0.65"/>
  <path d="M0,250 Q180,190 380,235 T720,210 Q770,225 800,240 L800,450 L0,450 Z" fill="url(#mtnGrad2)" opacity="0.8"/>

  <!-- Rolling Forefront Hills -->
  <path d="M0,290 Q220,240 440,285 T800,270 L800,450 L0,450 Z" fill="url(#hillGrad1)"/>
  <path d="M-20,335 Q260,285 520,330 T820,310 L820,450 L-20,450 Z" fill="url(#hillGrad2)"/>

  <!-- Small Business Main Street Silhouette / Vignette -->
  <g transform="translate(140, 240)">
    <!-- Shop 1 -->
    <rect x="0" y="40" width="110" height="110" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <polygon points="-5,40 115,40 105,15 5,15" fill="#00336d"/>
    <path d="M5,40 Q15,50 25,40 Q35,50 45,40 Q55,50 65,40 Q75,50 85,40 Q95,50 105,40" fill="#f59e0b"/>
    <!-- Shop Door & Window -->
    <rect x="18" y="70" width="32" height="80" rx="2" fill="#00336d"/>
    <rect x="62" y="70" width="36" height="48" rx="2" fill="#e0f2fe" stroke="#00336d" stroke-width="1.5"/>
    <line x1="80" y1="70" x2="80" y2="118" stroke="#00336d" stroke-width="1.5"/>
    <line x1="62" y1="94" x2="98" y2="94" stroke="#00336d" stroke-width="1.5"/>

    <!-- Shop 2 (Workshop / Enterprise) -->
    <rect x="125" y="10" width="135" height="140" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <polygon points="120,10 192,-25 265,10" fill="#0d542c"/>
    <!-- Large Warehouse / Workshop Window -->
    <rect x="145" y="30" width="95" height="45" rx="3" fill="#e0f2fe" stroke="#0d542c" stroke-width="1.5"/>
    <line x1="176" y1="30" x2="176" y2="75" stroke="#0d542c" stroke-width="1.5"/>
    <line x1="208" y1="30" x2="208" y2="75" stroke="#0d542c" stroke-width="1.5"/>
    <!-- Roll-up Cargo Door -->
    <rect x="155" y="90" width="75" height="60" fill="#f1f5f9" stroke="#0d542c" stroke-width="1.5"/>
    <line x1="155" y1="105" x2="230" y2="105" stroke="#94a3b8" stroke-width="1"/>
    <line x1="155" y1="120" x2="230" y2="120" stroke="#94a3b8" stroke-width="1"/>
    <line x1="155" y1="135" x2="230" y2="135" stroke="#94a3b8" stroke-width="1"/>

    <!-- Community Tree -->
    <circle cx="295" cy="85" r="38" fill="#15803d"/>
    <circle cx="280" cy="70" r="28" fill="#16a34a"/>
    <circle cx="315" cy="75" r="26" fill="#22c55e"/>
    <rect x="290" y="115" width="10" height="35" rx="2" fill="#78350f"/>
  </g>

  <!-- Catalytic Capital Rising Trajectory Spark -->
  <path d="M380,380 C480,360 550,280 620,170" fill="none" stroke="url(#goldAccent)" stroke-width="5" stroke-dasharray="6,4" stroke-linecap="round"/>
  <polygon points="626,160 628,178 612,172" fill="#f59e0b"/>

  <!-- Sparkle Stars -->
  <g fill="#f59e0b">
    <path d="M635,145 L638,135 L641,145 L651,148 L641,151 L638,161 L635,151 L625,148 Z"/>
    <path d="M480,210 L482,203 L484,210 L491,212 L484,214 L482,221 L480,214 L473,212 Z" opacity="0.8"/>
  </g>

  <!-- Bottom Brand Title Banner Overlay -->
  <rect x="0" y="405" width="800" height="45" fill="#002855" opacity="0.95"/>
  <rect x="0" y="402" width="800" height="3" fill="url(#goldAccent)"/>
  <text x="40" y="432" font-family="Outfit, Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff" letter-spacing="1.5">
    APPALACHIAN COMMUNITY CAPITAL &#8226; STORIES OF IMPACT
  </text>
  <text x="760" y="432" text-anchor="end" font-family="Outfit, Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#fbbf24">
    COMMUNITY ENTERPRISE
  </text>
</svg>