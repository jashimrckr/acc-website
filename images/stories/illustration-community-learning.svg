<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="commBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="50%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="heartSun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#commBg)"/>

  <!-- Morning Sunrise Glowing Rays -->
  <circle cx="400" cy="180" r="130" fill="#fef08a" opacity="0.4"/>
  <circle cx="400" cy="180" r="90" fill="#fde047" opacity="0.5"/>

  <!-- Community Center / Learning House Silhouette -->
  <g transform="translate(400, 240)">
    <!-- Base House -->
    <rect x="-80" y="0" width="160" height="110" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Pitch Roof -->
    <polygon points="-95,0 0,-70 95,0" fill="url(#roofGrad)"/>
    
    <!-- Chimney with Heart Smoke -->
    <rect x="45" y="-55" width="20" height="35" fill="#e2e8f0"/>
    <path d="M55,-70 C48,-80 45,-90 55,-98 C65,-90 62,-80 55,-70 Z" fill="#f43f5e"/>

    <!-- Schoolhouse Bell Tower / Clock Circle -->
    <circle cx="0" cy="-25" r="18" fill="#fef08a" stroke="#ffffff" stroke-width="2"/>
    <!-- Heart Bell -->
    <path d="M0,-22 C-5,-28 -11,-24 -11,-18 C-11,-13 0,-7 0,-7 C0,-7 11,-13 11,-18 C11,-24 5,-28 0,-22 Z" fill="#f59e0b"/>

    <!-- Windows with Welcoming Light -->
    <rect x="-60" y="25" width="40" height="40" rx="3" fill="#fef9c3" stroke="#0284c7" stroke-width="1.5"/>
    <line x1="-40" y1="25" x2="-40" y2="65" stroke="#0284c7" stroke-width="1.5"/>
    <line x1="-60" y1="45" x2="-20" y2="45" stroke="#0284c7" stroke-width="1.5"/>

    <rect x="20" y="25" width="40" height="40" rx="3" fill="#fef9c3" stroke="#0284c7" stroke-width="1.5"/>
    <line x1="40" y1="25" x2="40" y2="65" stroke="#0284c7" stroke-width="1.5"/>
    <line x1="20" y1="45" x2="60" y2="45" stroke="#0284c7" stroke-width="1.5"/>

    <!-- Welcoming Door -->
    <rect x="-18" y="45" width="36" height="65" rx="3" fill="#15803d"/>
    <circle cx="10" cy="80" r="3" fill="#facc15"/>

    <!-- Planter Flowers -->
    <rect x="-65" y="70" width="50" height="12" rx="2" fill="#78350f"/>
    <circle cx="-55" cy="65" r="5" fill="#f43f5e"/>
    <circle cx="-40" cy="63" r="5" fill="#eab308"/>
    <circle cx="-25" cy="65" r="5" fill="#a855f7"/>

    <rect x="15" y="70" width="50" height="12" rx="2" fill="#78350f"/>
    <circle cx="25" cy="65" r="5" fill="#f43f5e"/>
    <circle cx="40" cy="63" r="5" fill="#eab308"/>
    <circle cx="55" cy="65" r="5" fill="#a855f7"/>
  </g>

  <!-- Community Tree -->
  <g transform="translate(200, 260)">
    <circle cx="0" cy="-40" r="45" fill="#16a34a"/>
    <circle cx="-15" cy="-60" r="32" fill="#22c55e"/>
    <circle cx="20" cy="-55" r="30" fill="#4ade80"/>
    <rect x="-8" y="0" width="16" height="60" fill="#78350f" rx="3"/>
  </g>

  <g transform="translate(600, 270)">
    <circle cx="0" cy="-35" r="38" fill="#15803d"/>
    <circle cx="-10" cy="-50" r="28" fill="#16a34a"/>
    <circle cx="15" cy="-45" r="26" fill="#22c55e"/>
    <rect x="-6" y="0" width="12" height="50" fill="#78350f" rx="3"/>
  </g>

  <!-- Bottom Brand Ribbon -->
  <rect x="0" y="405" width="800" height="45" fill="#15803d"/>
  <rect x="0" y="402" width="800" height="3" fill="#facc15"/>
  <text x="40" y="432" font-family="Outfit, Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff" letter-spacing="1.5">
    LITTLE BLESSINGS CHILDCARE &amp; EARLY LEARNING &#8226; COMMUNITY IMPACT
  </text>
  <text x="760" y="432" text-anchor="end" font-family="Outfit, Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#fef08a">
    ACC SPOTLIGHT
  </text>
</svg>